[project]
name = "inkling-vs-quad-rtx-3090s"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=1.21.0",
    "jaxtyping>=0.3.10",
    "torch>=2.13.0",
    "transformers>=5.18.0",
    "tyro>=1.0.13",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import the code as `model...`, so put the repo root on sys.path.
pythonpath = ["."]

[tool.ty.rules]
all = "ignore"
unresolved-import = "error"
unresolved-attribute = "error"
